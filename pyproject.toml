[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "homeassistant-hospitable"
dynamic = ["version"]
description = "Hospitable integration for Home Assistant"
requires-python = ">=3.14.2"
license = { text = "Apache-2.0" }
dependencies = [
    # Home Assistant 2026.11.0 pins httpx2; keep this in step with it.
    "httpx2==2.14.0",
    "probatio>=0.13.0",
]

[project.optional-dependencies]
test = [
    # pytest-homeassistant is versioned with, and pins, Home Assistant
    # core; keep this floor in step with it.
    "homeassistant>=2026.11.0",
    "httpx2==2.14.0",
    "interrogate>=1.7",
    "mypy==2.3.0",
    "pillow>=11",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "probatio>=0.13.0",
    "pytest-homeassistant>=2026.11.0",
    "respx>=0.22",
]

[dependency-groups]
dev = [
    # pytest-homeassistant is versioned with, and pins, Home Assistant
    # core; keep this floor in step with it.
    "homeassistant>=2026.11.0",
    "httpx2==2.14.0",
    "interrogate>=1.7",
    "mypy==2.3.0",
    "pillow>=11",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "probatio>=0.13.0",
    "pytest-homeassistant>=2026.11.0",
    "respx>=0.22",
    "ruff>=0.15.21",
    # Stubs for the yaml import in scripts/render_release_notes.py and
    # its tests; mypy --install-types cannot fetch them without pip.
    "types-PyYAML",
    {include-group = "releasenotes"},
]
# reno manages releasenotes/notes/; kept in its own group so CI can
# install it without Home Assistant (uv run --only-group releasenotes).
releasenotes = [
    "reno>=4.1.0",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.*)"

[tool.hatch.build.targets.wheel]
packages = ["custom_components"]

[tool.pytest.ini_options]
# Let Home Assistant install its httpx alias before respx is imported
# (pytest-homeassistant README).
addopts = "-p no:respx"
asyncio_mode = "auto"
testpaths = ["tests"]
xfail_strict = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "."
files = ["custom_components", "tests"]

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "pytest_homeassistant.*",
    "reno.*",
]
ignore_missing_imports = true

# respx annotates against the real httpx package, while Home Assistant
# aliases httpx to httpx2 at runtime; following its imports would make
# every respx call in tests a false type error. Sanctioned by the
# constitution's Static Analysis Settings for this module only.
[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["custom_components"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLC0415"]

[tool.interrogate]
fail-under = 100
verbose = 2
