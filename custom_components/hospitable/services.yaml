---
send_message:
  fields:
    config_entry_id:
      required: false
      example: 01JX0000000000000000000000
      selector:
        config_entry:
          integration: hospitable
    entity_id:
      required: false
      example: sensor.example_property_reservation_status
      selector:
        entity:
          integration: hospitable
          domain: sensor
    reservation_uuid:
      required: false
      example: 11111111-2222-3333-4444-555555555555
      selector:
        text:
    body:
      required: true
      example: Your check-in instructions are on their way.
      selector:
        text:
          multiline: true
    images:
      required: false
      example:
        - https://example.com/welcome.png
      selector:
        object:
    sender_id:
      required: false
      example: 00000000-1111-2222-3333-444444444444
      selector:
        text:
get_messages:
  fields:
    config_entry_id:
      required: false
      example: 01JX0000000000000000000000
      selector:
        config_entry:
          integration: hospitable
    entity_id:
      required: false
      example: sensor.example_property_reservation_status
      selector:
        entity:
          integration: hospitable
          domain: sensor
    reservation_uuid:
      required: false
      example: 11111111-2222-3333-4444-555555555555
      selector:
        text:
find_reservation:
  fields:
    config_entry_id:
      required: false
      example: 01JX0000000000000000000000
      selector:
        config_entry:
          integration: hospitable
    entity_id:
      required: false
      example: sensor.example_property_reservation_status
      selector:
        entity:
          integration: hospitable
          domain: sensor
    reservation_uuid:
      required: false
      example: 11111111-2222-3333-4444-555555555555
      selector:
        text:
get_reservations:
  target:
    entity:
      integration: hospitable
    device:
      integration: hospitable
  fields:
    config_entry_id:
      required: false
      example: 01JX0000000000000000000000
      selector:
        config_entry:
          integration: hospitable
    property_id:
      required: false
      example: 66666666-7777-8888-9999-000000000000
      selector:
        text:
    lookforward_days:
      required: false
      example: 400
      selector:
        number:
          min: 1
          max: 1095
          step: 1
          mode: box
    lookbackward_days:
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 365
          step: 1
          mode: box
get_property_info:
