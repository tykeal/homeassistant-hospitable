name: 'CodeQL'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: ['main']
  schedule:
    - cron: '26 16 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: 'Audit Repository'
    # Migrated from lfit/releng-reusable-workflows, which is retiring,
    # to the security lane in lfreleng-actions/security-workflows.
    # The rename from reuse-python-codeql.yaml also renamed the config
    # input: 'codeql_config' is now 'config_file'. The lane builds its
    # matrix from the 'languages' input, which defaults to 'python',
    # so this caller keeps the previous single-language behaviour
    # without passing it.
    #
    # Check runs change name with the lane: 'Audit Repository /
    # CodeQL Scan: python' becomes 'Audit Repository / Analyze
    # (python)', alongside a new 'Audit Repository / Validate Workflow
    # Inputs' job. The old name was a required status check in the
    # 'Best Practices' ruleset, which now names the new one instead;
    # keep the two in step if this job or the lane is renamed again.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/codeql.yaml@b9d7b83b5696ab8388bcc11c3fe931563861e258  # v0.10.0
    with:
      config_file: .github/codeql/codeql-config.yml
      # Keep the code scanning category the old workflow derived from
      # its language/build-mode matrix. The lane derives
      # '<path>:analyze/language:python' instead, so main's existing
      # configuration would never be matched again: every pull request
      # would then report the CodeQL check as neutral ("1
      # configuration not found") and the ruleset's code scanning
      # merge protection could not compare alerts. Pinning the
      # category keeps the alert history continuous. It is per
      # language, so this must change if 'languages' ever does.
      # yamllint disable-line rule:line-length
      category: '.github/workflows/codeql.yml:analyze/build-mode:none/language:python'
    permissions:
      security-events: write  # Upload CodeQL results to code scanning.
      # required to fetch internal or private CodeQL packs
      packages: read  # Fetch internal or private CodeQL packs.
      # only required for workflows in private repositories
      actions: read  # Read workflow metadata (private repos only).
      contents: read  # Check out the repository to analyze.
