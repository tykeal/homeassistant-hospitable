# SPDX-License-Identifier: Apache-2.0

name: 'Release Drafter'

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    name: 'Update Release Draft'
    permissions:
      contents: write
      pull-requests: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: 'audit'

      # Full history and tags let reno find the notes added since the
      # latest release tag.
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No cache: this job holds contents: write.
      # yamllint disable-line rule:line-length
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: false

      # The draft body is rebuilt on every push, so release notes live in
      # releasenotes/notes/ and are rendered into the config each time.
      - name: 'Render release notes into the Release Drafter config'
        run: |
          uv run --frozen --only-group releasenotes \
            python scripts/render_release_notes.py \
            --release-drafter-config .github/release-drafter.yml \
            --output .github/release-drafter-generated.yml

      # Release Drafter compares against the last published release.
      # Before the first one exists it has no baseline, so it lists no
      # pull requests and warns. Until then, compare from the root
      # commit instead. The check asks for a published, non-prerelease
      # release rather than a v* tag because that is exactly how
      # Release Drafter picks its baseline; a bare tag with no release
      # would leave it without one. Afterwards `from` is empty, which
      # Release Drafter treats as unset.
      - name: 'Choose the change comparison baseline'
        id: 'baseline'
        shell: 'bash'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          published="$(gh release list --exclude-drafts \
            --exclude-pre-releases --limit 1 --json tagName --jq 'length')"
          if [ "${published}" != "0" ]; then
            echo "from=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          roots="$(git rev-list --max-parents=0 HEAD)"
          count="$(printf '%s\n' "${roots}" | grep -c .)"
          if [ "${count}" -ne 1 ]; then
            echo "::error::Expected one root commit, found ${count}"
            exit 1
          fi
          echo "No published release; comparing from root ${roots}"
          echo "from=${roots}" >> "${GITHUB_OUTPUT}"

      # yamllint disable-line rule:line-length
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: 'file:.github/release-drafter-generated.yml'
          from: ${{ steps.baseline.outputs.from }}
